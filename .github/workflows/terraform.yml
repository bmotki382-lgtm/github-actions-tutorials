name: terraform
on:
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  terraform:
    name: Tf plan
    runs-on: self-hosted

    defaults:
     run:
      working-directory: ./infra/startbust-app/
    
    steps:
     - name: checkout code
       uses: actions/checkout@v5
     - name: setup terraform
       uses: hashicorp/setup-terraform@v3
     - name: Tf init
       run: terraform init
     - name: Tf validate the code
       run: terraform validate
     - name: Tf plan
       run: terraform plan
