name: Deployment Workflow

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

env:
  DEPLOY_ENV: production

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Perform linting for application ${{ vars.APP_NAME }} in ${{ env.DEPLOY_ENV }} environment..."

  Test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Passoword for database is ${{ secrets.DB_PASSWORD }}"

  Security:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Running security checks..."
  
  Build:
    runs-on: ubuntu-latest
    needs: [Lint, Test, Security]
    steps:
      - run: echo "Building the application..." 

  Deploy:
    runs-on: ubuntu-latest
    needs: [Build]   
    steps:
      - run: echo "Deploying the application..."