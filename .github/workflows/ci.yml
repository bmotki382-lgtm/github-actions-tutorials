name: "CI Workflow"
on:
  push:
    branches:
      - main
  workflow_dispatch:
   inputs:
     environment:
       description: 'Environment to deploy to'
       required: true
       type: choice
       options:
         - dev 
         - staging
         - production
     deployment:
       description: 'Deployment type'
       required: false
       type: boolean

jobs:
  test:
    if : github.event.inputs.environment == 'dev'
    runs-on: ubuntu-latest
    steps:
     - name: Run tests
       run: |
         echo "Running tests for development environment"
    
  build:
    if : github.event.inputs.environment == 'staging'
    needs: test
    runs-on: ubuntu-latest
    steps:
     - name: Build project
       run: |
         echo "Building project for staging environment"

  deploy:
    if : github.event.inputs.environment == 'production' || github.event.inputs.deployment == true
    needs: build
    runs-on: ubuntu-latest
    steps:
     - name: deploy to production
       run: |
         echo "Deploying to production environment" 
