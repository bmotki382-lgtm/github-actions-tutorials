name: Deployment Workflow

on:
  workflow_dispatch:
   inputs:
      APP_NAME:
        description: 'Application Name'
        required: true
      DEPLOY_ENV:
        description: 'Deployment Environment'
        required: true
      choice:
        description: 'Choose an option'
        required: true
        default: 'option1'
        type: choice
        options:
          - option1
          - option2
          - option3

  pull_request:
    branches:
      - main



jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Perform linting for application ${{ vars.APP_NAME }} in ${{ env.DEPLOY_ENV }} environment..."

  Test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Passoword for database is ${{ secrets.DB_PASSWORD }}"

  Security:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Running security checks... ${{ inputs.choice }}" 
  
  Build:
    runs-on: ubuntu-latest
    needs: [Lint, Test, Security]
    steps:
      - run: echo "Building the application..." 

  Deploy:
    runs-on: ubuntu-latest
    needs: [Build]   
    steps:
      - run: echo "Deploying the application..."