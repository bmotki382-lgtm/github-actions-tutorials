on: #event triggers for the workflow
 workflow_dispatch: #allows manual triggering of the workflow
 #push: #on push events to the main branch
 pull_request: #on pull request events to the main branch
   branches:
     - main


jobs:
  build:
   runs-on: ubuntu-latest
   steps:
    - name: buildstep1
      run: echo "Setting up the build environment..."
    - name: buildstep2
      run: echo "Running tests..."
    - name: buildstep3
      run: echo "Building the project..."
  test:
   runs-on: ubuntu-latest
   needs: build
   steps:
    - name: teststep1
      run: echo "Testing the project..."
    - name: teststep2
      run: echo "Generating test reports..."