name: "CI Workflow"
on:
  push:
    branches:
      - main
  workflow_dispatch:
   inputs:
     environment:
       description: 'Environment to deploy to'
       required: true
       type: choice
       options:
         - dev 
         - staging
         - production
     deployment:
       description: 'Deployment type'
       required: false
       type: boolean
#env:
 # APP_NAME = employee-app
  #APP_VERSION = 1.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
     - name: Run tests
       run: |
         echo "Test passed"
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
     - name: Build project
       run: |
         echo "Building employee-app version ${{ env.APP_VERSION }}"
         echo "Build successful"
  deploy:
    
    needs: build
    runs-on: ubuntu-latest
    steps:
     - name: deploy to production
       if : github.event.inputs.environment == 'production' && github.event.inputs.deployment == true
       run: |
         echo "Deploying employee-app to production"
         echo "Deployment successful" 
     - name: secret
       if : github.event.inputs.environment == 'production' && github.event.inputs.deployment == true
       run:  
         echo "Deploy token is ${{ secrets.DEPLOY_TOKEN }}"
     - name: deploy to staging
       if : github.event.inputs.environment == 'staging' 
       run: |
         echo "Deploying employee-app to staging"
         echo "Deployment successful"    
     - name: deploy to dev
       if : github.event.inputs.environment == 'dev' 
       run: |
         echo "Deploying employee-app to dev"
         echo "Deployment successful"