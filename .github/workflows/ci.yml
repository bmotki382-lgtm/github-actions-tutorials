Name : Building an env
on:
  push:
    branches: [ main ]
  workflow_dispatch: 
  inputs:
   environment:
    description: "CI workflow for building and testing the project"
    required: true
    type: choice
    default: "dev"
    options:
      - "dev"
      - "staging"
      - "production"
   Deployment:
    description: "Deployment check"  
    required: true
    default: "false"
    type: boolean  
     
env:    
  APP_NAME = employee-app
  APP_VERSION = 1.0

jobs:
  test:
   if: github.event.inputs.environment == 'dev'  
   runs-on: ubuntu-latest
   steps:
     - echo "Running tests for ${{ env.APP_NAME }} version ${{ env.APP_VERSION }}"
  
  build:
   if: github.event.inputs.environment == 'staging'
   needs: test
   runs-on: ubuntu-latest
   steps:
      - echo "Building ${{ env.APP_NAME }} version ${{ env.APP_VERSION }}"
 
  deploy:
    if: github.event.inputs.environment == 'production' || github.event.inputs.Deployment == 'true'
    needs: build  
    runs-on: ubuntu-latest
    steps:
      - echo "Deploying ${{ env.APP_NAME }} version ${{ env.APP_VERSION }} to ${{ github.event.inputs.environment }}"
